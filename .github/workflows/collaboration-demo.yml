name: Collaboration demo

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  propose-checklist:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Open a pull request as GitHub Actions
        shell: bash
        run: |
          set -euo pipefail
          branch="demo/review-checklist-${GITHUB_RUN_ID}"
          mkdir -p docs
          cat > docs/review-checklist.md <<'EOF'
          # Чек-лист проверки pull request

          - Указана связанная задача.
          - Содержание изменений соответствует описанию.
          - Рецензент проверил затронутые строки и оставил итог.
          - После слияния обновлена локальная ветка main.
          EOF
          gh api "repos/$GH_REPO/git/refs" -f ref="refs/heads/$branch" -f sha="$GITHUB_SHA" --jq .ref
          gh api --method PUT "repos/$GH_REPO/contents/docs/review-checklist.md" \
            -f branch="$branch" -f message='Добавить чек-лист проверки pull request' \
            -f content="$(base64 -w0 docs/review-checklist.md)" --jq .commit.sha
          number=$(gh api "repos/$GH_REPO/pulls" -f head="$branch" -f base=main \
            -f title='Добавить чек-лист проверки pull request' \
            -f body='Учебное предложение от GitHub Actions. Чек-лист можно проверить перед слиянием. Closes #1.' --jq .number)
          printf 'Pull request: https://github.com/%s/pull/%s\n' "$GH_REPO" "$number"
          jq -n --arg login "${GH_REPO%/*}" '{reviewers: [$login]}' |
            gh api "repos/$GH_REPO/pulls/$number/requested_reviewers" --input - --jq '.users[].login'
